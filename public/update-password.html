<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Password - HCILearn</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
           UPDATE PASSWORD PAGE
           ========================================== */

        body.update-password-page {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;

            background-color: #f4f6f9;

            font-family: 'Segoe UI',
                         Tahoma,
                         Geneva,
                         Verdana,
                         sans-serif;
        }


        .update-container {
            width: 100%;
            max-width: 400px;

            padding: 40px;

            background: #ffffff;

            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.10);

            text-align: center;
        }


        .update-container .update-logo {
            height: 60px;

            margin-bottom: 20px;
        }


        .update-container h2 {
            margin: 0 0 10px;

            font-size: 28px;

            line-height: 1.25;

            color: #111;
        }


        .update-description {
            margin: 0 0 22px;

            font-size: 14px;

            line-height: 1.5;

            color: #666;
        }


        .update-container .update-input-group {
            margin-bottom: 20px;

            text-align: left;
        }


        .update-container .update-input-group label {
            display: block;

            margin-bottom: 6px;

            font-size: 15px;

            font-weight: 700;

            color: #222;
        }


        .update-container .update-input-group input[type="password"],
        .update-container .update-input-group input[type="text"] {
            width: 100%;

            height: 44px;

            padding: 0 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            box-sizing: border-box;

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }


        .update-container .update-input-group input:focus {
            border-color: #007bff;

            box-shadow:
                0 0 0 2px rgba(0,123,255,0.10);
        }


        .update-container .password-toggle {
            display: flex;

            align-items: center;

            gap: 6px;

            margin-top: 8px;

            font-size: 13px;
        }


        .update-container .password-toggle input {
            margin: 0;

            cursor: pointer;
        }


        .update-container .password-toggle label {
            margin: 0;

            font-size: 13px;

            font-weight: 500;

            cursor: pointer;
        }


        .update-container #msg {
            display: none;

            margin: 0 0 16px;

            font-size: 14px;

            line-height: 1.4;
        }


        .update-container .update-btn {
            width: 100%;

            height: 46px;

            padding: 0 12px;

            background-color: #007bff;

            color: #ffffff;

            border: none;

            border-radius: 5px;

            font-family: inherit;

            font-size: 16px;

            cursor: pointer;

            transition: background-color 0.2s ease;
        }


        .update-container .update-btn:hover {
            background-color: #0056b3;
        }


        .update-container .update-btn:disabled {
            background-color: #8fb8e8;

            cursor: not-allowed;
        }


        .update-container .back-link {
            display: block;

            margin-top: 16px;

            font-size: 14px;

            color: #007bff;

            text-decoration: none;
        }


        .update-container .back-link:hover {
            text-decoration: underline;
        }


        @media (max-width: 480px) {

            body.update-password-page {
                padding: 20px 12px;
            }

            .update-container {
                padding: 28px 20px;
            }

            .update-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body class="update-password-page">

    <div class="update-container">

        <img
            src="images.png"
            alt="University Logo"
            class="update-logo"
        >

        <h2>
            Create a New Password
        </h2>

        <p class="update-description">
            Enter your new password below to restore access to your account.
        </p>


        <p id="msg"></p>


        <form id="updatePasswordForm">

            <!-- NEW PASSWORD -->
            <div class="update-input-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="update-input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your new password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >


                <div class="password-toggle">

                    <input
                        type="checkbox"
                        id="showPw"
                    >

                    <label for="showPw">
                        Show Password
                    </label>

                </div>

            </div>


            <!-- SAVE PASSWORD -->
            <button
                type="submit"
                id="updateBtn"
                class="update-btn"
            >
                Save Password &amp; Log In
            </button>

        </form>


        <a
            class="back-link"
            href="login.html"
        >
            &larr; Back to Login
        </a>

    </div>


    <script src="js/api.js"></script>

    <script>

        /* ==========================================
           GET RESET TOKEN
           ========================================== */

        const token =
            new URLSearchParams(
                window.location.search
            ).get('token');


        const msgEl =
            document.getElementById('msg');

        const form =
            document.getElementById(
                'updatePasswordForm'
            );

        const btn =
            document.getElementById('updateBtn');


        /* ==========================================
           MESSAGE
           ========================================== */

        function showMsg(text, isError) {

            msgEl.textContent = text;

            msgEl.style.color =
                isError
                    ? '#c0392b'
                    : '#27ae60';

            msgEl.style.display = 'block';
        }


        /* ==========================================
           PASSWORD VALIDATION
           ========================================== */

        function isValidPassword(password) {

            if (password.length < 8)
                return false;

            if (/^[a-z]+$/.test(password))
                return false;

            if (/^[A-Z]+$/.test(password))
                return false;

            if (/^[0-9]+$/.test(password))
                return false;

            return true;
        }


        /* ==========================================
           SHOW / HIDE PASSWORD
           ========================================== */

        document
            .getElementById('showPw')
            .addEventListener(
                'change',
                function () {

                    const type =
                        this.checked
                            ? 'text'
                            : 'password';

                    document.getElementById(
                        'newPassword'
                    ).type = type;

                    document.getElementById(
                        'confirmPassword'
                    ).type = type;
                }
            );


        /* ==========================================
           CHECK RESET TOKEN
           ========================================== */

        if (!token) {

            form.style.display = 'none';

            showMsg(
                'This reset link is missing or invalid. Please request a new one from the login page.',
                true
            );
        }


        /* ==========================================
           UPDATE PASSWORD
           ========================================== */

        form.addEventListener(
            'submit',
            async function (e) {

                e.preventDefault();

                msgEl.style.display = 'none';


                const password =
                    document
                        .getElementById('newPassword')
                        .value;


                const confirm =
                    document
                        .getElementById('confirmPassword')
                        .value;


                if (password !== confirm) {

                    showMsg(
                        'Passwords do not match.',
                        true
                    );

                    return;
                }


                if (!isValidPassword(password)) {

                    showMsg(
                        'Password must be at least 8 characters and not all letters or all numbers.',
                        true
                    );

                    return;
                }


                btn.disabled = true;
                btn.textContent = 'Saving...';


                try {

                    await api.post(
                        '/auth/reset-password',
                        {
                            token,
                            password
                        }
                    );


                    form.style.display = 'none';

                    showMsg(
                        'Password successfully updated! Redirecting you to the login page...',
                        false
                    );


                    setTimeout(
                        () => {
                            window.location.href =
                                'login.html';
                        },
                        2000
                    );

                } catch (err) {

                    showMsg(
                        err.message,
                        true
                    );

                    btn.disabled = false;

                    btn.textContent =
                        'Save Password & Log In';
                }
            }
        );

    </script>

</body>
</html>
