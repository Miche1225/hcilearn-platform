<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - HCILearn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Simpleng inline styles para sa pahinang ito, nakasentro ang form */
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; font-family: sans-serif; }
        .update-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="update-container">
        <img src="images.png" alt="Logo" style="height: 60px; margin-bottom: 20px;">
        <h2>Gumawa ng Bagong Password</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Ilagay ang iyong bagong password sa ibaba upang maibalik ang access sa iyong account.</p>

        <form id="updatePasswordForm">
            <div class="input-group">
                <label for="newPassword"><strong>Bagong Password</strong></label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" required minlength="6">
            </div>

            <button type="submit" id="updateBtn">I-save at Mag-login</button>
        </form>
    </div>

    <script>
        // I-INITIALIZE ANG SUPABASE DITO
        // Palitan ang mga ito ng iyong aktwal na Supabase credentials mula sa Dashboard -> Settings -> API
        const SUPABASE_URL = 'https://ajkbqtjgvyqoxmdoziio.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqa2JxdGpndnlxb3htZG96aWlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTQyMDQsImV4cCI6MjEwNjAzMDIwNH0.y7xDTCe7SDbn8tPVD5DLuxUR_EdcRvlXPG9UwKFka8s';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Suriin muna kung may error sa URL (hal. otp_expired) galing sa Supabase
        // bago pahintulutan ang user na mag-set ng bagong password.
        (function checkForLinkError() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const error = params.get('error');
            const errorDescription = params.get('error_description');

            if (error) {
                const container = document.querySelector('.update-container');
                container.innerHTML = `
                    <img src="images.png" alt="Logo" style="height: 60px; margin-bottom: 20px;">
                    <h2>Hindi Valid ang Link</h2>
                    <p style="color: #d9534f; font-size: 14px; margin-bottom: 20px;">
                        ${errorDescription ? errorDescription.replace(/\+/g, ' ') : 'Ang password reset link ay invalid o expired na.'}
                    </p>
                    <p style="color: #666; font-size: 13px; margin-bottom: 20px;">
                        Mangyaring mag-request ulit ng bagong reset link sa login page. I-click agad ang link
                        pagdating ng email (huwag i-forward o buksan sa ibang browser/device) para hindi ito ma-expire.
                    </p>
                    <a href="login.html" style="display:inline-block; padding: 12px 20px; background-color: #007bff; color: white; border-radius: 5px; text-decoration: none;">Bumalik sa Login</a>
                `;
            }
        })();

        // Hawakan ang pagsusumite ng form
        document.getElementById('updatePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPasswordValue = document.getElementById('newPassword').value;
            const updateBtn = document.getElementById('updateBtn');

            updateBtn.disabled = true;
            updateBtn.textContent = 'Nagsa-save...';

            const { data, error } = await supabase.auth.updateUser({
                password: newPasswordValue
            });

            if (error) {
                alert("Error updating password: " + error.message);
                updateBtn.disabled = false;
                updateBtn.textContent = 'I-save at Mag-login';
            } else {
                alert("Password successfully updated! You can now log in.");
                // I-redirect ang user pabalik sa login page pagkatapos magtagumpay
                window.location.href = "login.html"; 
            }
        });
    </script>
</body>
</html>
