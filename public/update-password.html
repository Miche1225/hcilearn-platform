<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - HCILearn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f6f9; margin: 0; font-family: sans-serif; }
        .update-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #8fb8e8; cursor: not-allowed; }
        #msg { display: none; font-size: 14px; margin: 0 0 16px; }
        .back-link { display: block; margin-top: 16px; font-size: 14px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="update-container">
        <img src="images.png" alt="Logo" style="height: 60px; margin-bottom: 20px;">
        <h2>Gumawa ng Bagong Password</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Ilagay ang iyong bagong password sa ibaba upang maibalik ang access sa iyong account.</p>

        <p id="msg"></p>

        <form id="updatePasswordForm">
            <div class="input-group">
                <label for="newPassword"><strong>Bagong Password</strong></label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8">
            </div>

            <div class="input-group">
                <label for="confirmPassword"><strong>Ulitin ang Password</strong></label>
                <input type="password" id="confirmPassword" placeholder="Re-type your new password" required minlength="8">
                <div style="margin-top: 8px; font-size: 13px;">
                    <input type="checkbox" id="showPw" style="width:auto; margin:0 6px 0 0;">
                    <label for="showPw">Show Password</label>
                </div>
            </div>

            <button type="submit" id="updateBtn">I-save at Mag-login</button>
        </form>

        <a class="back-link" href="login.html">← Back to login</a>
    </div>

    <script src="js/api.js"></script>
    <script>
        // The reset link from the email looks like: update-password.html?token=XXXX
        const token = new URLSearchParams(window.location.search).get('token');
        const msgEl = document.getElementById('msg');
        const form = document.getElementById('updatePasswordForm');
        const btn = document.getElementById('updateBtn');

        function showMsg(text, isError) {
            msgEl.textContent = text;
            msgEl.style.color = isError ? '#c0392b' : '#27ae60';
            msgEl.style.display = 'block';
        }

        function isValidPassword(pw) {
            if (pw.length < 8) return false;
            if (/^[a-z]+$/.test(pw)) return false;
            if (/^[A-Z]+$/.test(pw)) return false;
            if (/^[0-9]+$/.test(pw)) return false;
            return true;
        }

        document.getElementById('showPw').addEventListener('change', function () {
            const type = this.checked ? 'text' : 'password';
            document.getElementById('newPassword').type = type;
            document.getElementById('confirmPassword').type = type;
        });

        if (!token) {
            form.style.display = 'none';
            showMsg('This reset link is missing or invalid. Please request a new one from the login page.', true);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            msgEl.style.display = 'none';

            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                showMsg('Passwords do not match.', true);
                return;
            }
            if (!isValidPassword(password)) {
                showMsg('Password must be at least 8 characters and not all letters or all numbers.', true);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Nagsa-save...';
            try {
                await api.post('/auth/reset-password', { token, password });
                form.style.display = 'none';
                showMsg('Password successfully updated! Redirecting you to login...', false);
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } catch (err) {
                showMsg(err.message, true);
                btn.disabled = false;
                btn.textContent = 'I-save at Mag-login';
            }
        });
    </script>
</body>
</html>
