<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Page</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">

            <div class="sidebar-header">

                <i class="fa-solid fa-book-open logo-icon"></i>

                <span class="logo-text">
                    HCILearn
                </span>

            </div>


            <nav class="sidebar-nav">

                <a
                    href="Dashboard.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-border-all"></i>
                    Dashboard
                </a>


                <a
                    href="WatchVideo.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-play"></i>
                    Watch Video
                </a>


                <a
                    href="ReadLesson.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-book"></i>
                    Read Lesson
                </a>


                <a
                    href="CaseStudies.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-folder"></i>
                    Case Studies
                </a>


                <a
                    href="StudyCards.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-rotate"></i>
                    Study Cards
                </a>


                <a
                    href="Account.html"
                    class="nav-item active"
                >
                    <i class="fa-solid fa-circle-user"></i>
                    Account
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <div class="account-wrapper">


                <!-- Header Banner -->
                <div class="account-banner">

                    <div class="banner-title">

                        <i class="fa-solid fa-pen"></i>

                        <h2>
                            Edit Your Information
                        </h2>

                    </div>


                    <p>
                        Update your personal details and account settings.
                    </p>

                </div>


                <!-- Message -->
                <p
                    id="accountMsg"
                    style="
                        display:none;
                        margin:0 20px;
                        padding:10px 14px;
                        border-radius:8px;
                    "
                ></p>


                <form
                    id="accountForm"
                    class="account-form"
                >


                    <!-- =====================================
                         PROFILE PHOTO
                         ===================================== -->

                    <div class="edit-section">

                        <div class="section-title">

                            <i class="fa-solid fa-camera"></i>

                            <h3>
                                Profile Photo
                            </h3>

                        </div>


                        <div
                            class="section-content photo-upload-content"
                        >

                            <img
                                src="profile-pic.jpg"
                                alt="Profile"
                                class="current-photo"
                                id="currentPhoto"
                            >


                            <div class="upload-controls">

                                <p>
                                    Upload a new photo (optional)
                                </p>


                                <input
                                    type="file"
                                    id="profile-upload"
                                    accept="image/*"
                                    class="file-input"
                                >

                            </div>

                        </div>

                    </div>


                    <!-- =====================================
                         PERSONAL INFORMATION
                         ===================================== -->

                    <div class="edit-section">

                        <div class="section-title">

                            <i class="fa-solid fa-address-card"></i>

                            <h3>
                                Personal Information
                            </h3>

                        </div>


                        <div class="section-content">

                            <div class="form-grid">


                                <!-- Full Name -->
                                <div class="input-group">

                                    <label for="full-name">
                                        Full Name:
                                    </label>


                                    <input
                                        type="text"
                                        id="full-name"
                                        required
                                    >

                                </div>


                                <!-- Year and Section -->
                                <div class="input-group">

                                    <label for="year-section">
                                        Year &amp; Section:
                                    </label>


                                    <input
                                        type="text"
                                        id="year-section"
                                        required
                                    >

                                </div>


                                <!-- Program -->
                                <div class="input-group">

                                    <label for="program">
                                        Program/Course:
                                    </label>


                                    <input
                                        type="text"
                                        id="program"
                                        required
                                    >

                                </div>


                                <!-- New Email -->
                                <div class="input-group">

                                    <label for="email">
                                        New Email Address (optional):
                                    </label>


                                    <input
                                        type="email"
                                        id="email"
                                        placeholder="Enter a new email address to change it"
                                        autocomplete="email"
                                    >

                                </div>


                                <!-- Student ID -->
                                <div class="input-group">

                                    <label for="student-id">
                                        Student ID:
                                    </label>


                                    <input
                                        type="text"
                                        id="student-id"
                                        maxlength="6"
                                        minlength="6"
                                        inputmode="numeric"
                                        pattern="[0-9]{6}"
                                        autocomplete="off"
                                        required
                                    >

                                </div>


                                <!-- Password -->
                                <div class="input-group">

                                    <label for="password">
                                        New Password (optional):
                                    </label>


                                    <input
                                        type="password"
                                        id="password"
                                        minlength="8"
                                        placeholder="Leave blank to keep your current password"
                                        autocomplete="new-password"
                                    >


                                    <div
                                        class="account-password-toggle"
                                    >

                                        <input
                                            type="checkbox"
                                            id="show-password"
                                        >


                                        <label
                                            for="show-password"
                                        >
                                            Show Password
                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- =====================================
                         ACTION BUTTONS
                         ===================================== -->

                    <div
                        class="save-action account-actions"
                    >

                        <button
                            type="submit"
                            class="btn-save"
                            id="saveBtn"
                        >
                            Save
                        </button>


                        <button
                            type="button"
                            class="btn-delete-account"
                            id="deleteAccountBtn"
                        >

                            <i class="fa-solid fa-trash"></i>

                            Delete Account

                        </button>

                    </div>


                </form>

            </div>

        </main>

    </div>


    <script src="js/api.js"></script>


    <script>


        /* =================================================
           ELEMENT REFERENCES
           ================================================= */

        const els = {

            fullName:
                document.getElementById(
                    'full-name'
                ),

            yearSection:
                document.getElementById(
                    'year-section'
                ),

            program:
                document.getElementById(
                    'program'
                ),

            email:
                document.getElementById(
                    'email'
                ),

            studentId:
                document.getElementById(
                    'student-id'
                ),

            password:
                document.getElementById(
                    'password'
                )

        };


        const msgEl =
            document.getElementById(
                'accountMsg'
            );


        /* =================================================
           MESSAGE HELPER
           ================================================= */

        function showMessage(
            text,
            isError
        ) {

            msgEl.textContent =
                text;

            msgEl.style.display =
                'block';

            msgEl.style.background =
                isError
                    ? '#fdecea'
                    : '#e8f8ef';

            msgEl.style.color =
                isError
                    ? '#c0392b'
                    : '#1e7e45';
        }


        /* =================================================
           LOAD ACCOUNT

           Email is intentionally NOT loaded because
           only email_hash exists in the database.
           ================================================= */

        async function loadAccount() {

            const user =
                await requireAuth();


            if (!user)
                return;


            els.fullName.value =
                user.fullName || '';


            els.yearSection.value =
                user.yearSection || '';


            els.program.value =
                user.program || '';


            els.studentId.value =
                user.studentId || '';


            /*
                Email is intentionally blank.

                Enter an email only when changing it.
            */
            els.email.value =
                '';


            if (
                user.profilePhoto
            ) {

                document
                    .getElementById(
                        'currentPhoto'
                    )
                    .src =
                    user.profilePhoto;
            }
        }


        /* =================================================
           STUDENT ID - NUMBERS ONLY
           ================================================= */

        els.studentId.addEventListener(
            'input',
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, '')
                        .substring(0, 6);

            }
        );


        /* =================================================
           SHOW / HIDE PASSWORD
           ================================================= */

        document
            .getElementById(
                'show-password'
            )
            .addEventListener(
                'change',
                function () {

                    els.password.type =
                        this.checked
                            ? 'text'
                            : 'password';

                }
            );


        /* =================================================
           DELETE ACCOUNT
           ================================================= */

        document
            .getElementById(
                'deleteAccountBtn'
            )
            .addEventListener(
                'click',
                async function () {


                    const confirmed =
                        confirm(
                            'Are you sure you want to delete your account? This action cannot be undone and all your progress will be lost.'
                        );


                    if (!confirmed)
                        return;


                    const btn =
                        this;


                    btn.disabled =
                        true;


                    btn.textContent =
                        'Deleting...';


                    try {

                        const response =
                            await fetch(
                                '/api/account',
                                {
                                    method: 'DELETE',
                                    credentials: 'include'
                                }
                            );


                        const data =
                            await response
                                .json()
                                .catch(
                                    () => ({})
                                );


                        if (
                            !response.ok
                        ) {

                            throw new Error(

                                data.error ||

                                'Failed to delete account.'

                            );
                        }


                        window.location.href =
                            'login.html';


                    } catch (err) {

                        showMessage(
                            err.message,
                            true
                        );


                        btn.disabled =
                            false;


                        btn.innerHTML =
                            '<i class="fa-solid fa-trash"></i> Delete Account';

                    }

                }
            );


        /* =================================================
           PROFILE PHOTO UPLOAD
           ================================================= */

        document
            .getElementById(
                'profile-upload'
            )
            .addEventListener(
                'change',
                async function () {


                    const file =
                        this.files[0];


                    if (!file)
                        return;


                    const formData =
                        new FormData();


                    formData.append(
                        'photo',
                        file
                    );


                    try {

                        const response =
                            await fetch(
                                '/api/account/photo',
                                {
                                    method: 'POST',
                                    credentials: 'include',
                                    body: formData
                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            throw new Error(
                                data.error ||
                                'Upload failed.'
                            );
                        }


                        document
                            .getElementById(
                                'currentPhoto'
                            )
                            .src =
                            data.profilePhoto;


                        showMessage(
                            'Profile photo updated successfully.',
                            false
                        );


                    } catch (err) {

                        showMessage(
                            err.message,
                            true
                        );

                    }

                }
            );


        /* =================================================
           SAVE ACCOUNT
           ================================================= */

        document
            .getElementById(
                'accountForm'
            )
            .addEventListener(
                'submit',
                async function (e) {

                    e.preventDefault();


                    const btn =
                        document.getElementById(
                            'saveBtn'
                        );


                    /* --------------------------------------
                       Validate student ID.
                       -------------------------------------- */

                    if (
                        !/^\d{6}$/.test(
                            els.studentId.value.trim()
                        )
                    ) {

                        showMessage(
                            'Student ID must contain exactly 6 digits.',
                            true
                        );

                        return;
                    }


                    const newEmail =
                        els.email.value.trim();


                    const payload = {

                        fullName:
                            els.fullName.value.trim(),

                        yearSection:
                            els.yearSection.value.trim(),

                        program:
                            els.program.value.trim(),

                        studentId:
                            els.studentId.value.trim()

                    };


                    /*
                        Only send email when changing it.

                        A blank email means:
                        keep the existing email_hash.
                    */
                    if (
                        newEmail
                    ) {

                        payload.email =
                            newEmail;
                    }


                    /*
                        Only send password when changing it.
                    */
                    if (
                        els.password.value
                    ) {

                        payload.password =
                            els.password.value;
                    }


                    btn.disabled =
                        true;


                    btn.textContent =
                        'Saving...';


                    try {

                        await api.put(
                            '/account',
                            payload
                        );


                        els.password.value =
                            '';


                        els.email.value =
                            '';


                        showMessage(
                            'Account information updated successfully.',
                            false
                        );


                    } catch (err) {

                        showMessage(
                            err.message,
                            true
                        );


                    } finally {

                        btn.disabled =
                            false;


                        btn.textContent =
                            'Save';
                    }

                }
            );


        /* =================================================
           INITIALIZE
           ================================================= */

        loadAccount();

    </script>

</body>
</html>
