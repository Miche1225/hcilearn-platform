<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="HCILearn | Interactive Study Guide">
    <meta property="og:description" content="The official HCI 2 learning platform and reviewer system for UEP IT students.">
    <meta property="og:image" content="https://hcilearn-platform.onrender.com/signup-preview.jpg">
    <meta property="og:url" content="https://hcilearn-platform.onrender.com/">
    <meta property="og:type" content="website">
</head>
<body>

    <div class="signup-container">
        <div class="glass-card">

            <div class="header-text">
                <h2>Sign Up</h2>
                <p>Just a few quick things to get started</p>
            </div>

            <form id="signupForm">

                <p id="signupError" style="color:#c0392b; display:none; margin:0 0 10px;"></p>

                <div class="input-grid">

                    <!-- FIRST NAME -->
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Juan"
                            maxlength="80"
                            required
                        >
                    </div>

                    <!-- LAST NAME -->
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Dela Cruz"
                            maxlength="80"
                            required
                        >
                    </div>

                    <!-- YEAR -->
                    <div class="input-group">
                        <label for="year">Year</label>

                        <select id="year" required>
                            <option value="" selected disabled>
                                Select year
                            </option>

                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>

                    <!-- SECTION -->
                    <div class="input-group">
                        <label for="section">Section</label>

                        <select id="section" required>
                            <option value="" selected disabled>
                                Select section
                            </option>

                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>

                    <!-- PROGRAM -->
                    <div class="input-group">
                        <label for="program">Program/Course (BSIT)</label>

                        <input
                            type="text"
                            id="program"
                            value="BSIT"
                            maxlength="80"
                            required
                        >
                    </div>

                    <!-- EMAIL -->
                    <div class="input-group">
                        <label for="email">Gmail / Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@gmail.com"
                            maxlength="254"
                            autocomplete="email"
                            required
                        >

                        <small style="display:block; color:#666; margin-top:4px;">
                            Your email is protected with a server-side HMAC lookup hash.
                        </small>
                    </div>

                    <!-- STUDENT ID -->
                    <div class="input-group">
                        <label for="studentId">Student ID</label>

                        <input
                            type="text"
                            id="studentId"
                            maxlength="40"
                            required
                        >
                    </div>

                    <!-- PASSWORD -->
                    <div class="input-group">
                        <label for="password-input">Password</label>

                        <input
                            type="password"
                            id="password-input"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <small style="display:block; color:#666; margin-top:4px;">
                            Password must be at least 8 characters.
                        </small>

                        <div class="checkbox-group">
                            <input type="checkbox" id="show-password">
                            <label for="show-password">Show Password</label>
                        </div>
                    </div>

                </div>

                <div class="button-container">
                    <button
                        type="submit"
                        class="signup-btn"
                        id="signupBtn"
                    >
                        Sign up
                    </button>
                </div>

                <div
                    class="login-link-container"
                    style="text-align: center; margin-top: 15px;"
                >
                    <p>
                        Already have an account?
                        <a href="login.html">Log in</a>
                    </p>
                </div>

            </form>
        </div>
    </div>

    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const showPasswordCheckbox =
                document.getElementById('show-password');

            const passwordInput =
                document.getElementById('password-input');

            // SHOW / HIDE PASSWORD
            showPasswordCheckbox.addEventListener('change', function () {

                passwordInput.type =
                    this.checked ? 'text' : 'password';

            });

            // SIGNUP FORM
            document.getElementById('signupForm').addEventListener(
                'submit',
                async function (e) {

                    e.preventDefault();

                    const errorEl =
                        document.getElementById('signupError');

                    const btn =
                        document.getElementById('signupBtn');

                    errorEl.style.display = 'none';

                    // GET FORM VALUES
                    const payload = {

                        firstName:
                            document.getElementById('firstName')
                            .value
                            .trim(),

                        lastName:
                            document.getElementById('lastName')
                            .value
                            .trim(),

                        year:
                            document.getElementById('year')
                            .value,

                        section:
                            document.getElementById('section')
                            .value,

                        program:
                            document.getElementById('program')
                            .value
                            .trim(),

                        email:
                            document.getElementById('email')
                            .value
                            .trim(),

                        studentId:
                            document.getElementById('studentId')
                            .value
                            .trim(),

                        password:
                            document.getElementById('password-input')
                            .value
                    };

                    // EMAIL VALIDATION
                    const EMAIL_REGEX =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    // PASSWORD VALIDATION
                    function isValidPassword(pw) {

                        if (pw.length < 8)
                            return false;

                        if (/^[a-z]+$/.test(pw))
                            return false;

                        if (/^[A-Z]+$/.test(pw))
                            return false;

                        if (/^[0-9]+$/.test(pw))
                            return false;

                        return true;
                    }

                    // NAME VALIDATION
                    if (
                        !payload.firstName ||
                        !payload.lastName
                    ) {

                        errorEl.textContent =
                            'Please enter both your first name and last name.';

                        errorEl.style.display = 'block';

                        return;
                    }

                    // YEAR / SECTION VALIDATION
                    if (
                        !payload.year ||
                        !payload.section
                    ) {

                        errorEl.textContent =
                            'Please select your year and section.';

                        errorEl.style.display = 'block';

                        return;
                    }

                    // EMAIL VALIDATION
                    if (!EMAIL_REGEX.test(payload.email)) {

                        errorEl.textContent =
                            'Please enter a valid email address.';

                        errorEl.style.display = 'block';

                        return;
                    }

                    // PASSWORD VALIDATION
                    if (!isValidPassword(payload.password)) {

                        errorEl.textContent =
                            'Password must be at least 8 characters and not all letters or all numbers.';

                        errorEl.style.display = 'block';

                        return;
                    }

                    // DISABLE BUTTON
                    btn.disabled = true;
                    btn.textContent = 'Signing up...';

                    try {

                        await api.post(
                            '/auth/signup',
                            payload
                        );

                        window.location.href =
                            'Dashboard.html';

                    } catch (err) {

                        errorEl.textContent =
                            err.message;

                        errorEl.style.display =
                            'block';

                        btn.disabled = false;

                        btn.textContent =
                            'Sign up';
                    }

                }
            );
        });
    </script>

</body>
</html>
