<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- HCILearn icon: "HCi" wordmark, the dot of the i is the yellow accent.
       Letters are drawn as shapes so it looks the same on every device. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2f5f"/>
      <stop offset="1" stop-color="#2f63a6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#gloss)"/>

  <g fill="#ffffff">
    <!-- H -->
    <rect x="11.75" y="20" width="5.5" height="21" rx="1"/>
    <rect x="20.25" y="20" width="5.5" height="21" rx="1"/>
    <rect x="11.75" y="27.75" width="14" height="5.5"/>
    <!-- i stem -->
    <rect x="46.75" y="27" width="5.5" height="14" rx="1"/>
  </g>

  <!-- C -->
  <path d="M43.35 25.3A7.8 7.8 0 1 0 43.35 35.7" fill="none" stroke="#ffffff" stroke-width="5.5"/>

  <!-- Yellow dot of the i -->
  <circle cx="49.5" cy="20.5" r="3.6" fill="#ffc845"/>
</svg>
