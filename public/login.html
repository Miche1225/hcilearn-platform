<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta property="og:title" content="HCILearn | Interactive Study Guide">
    <meta property="og:description" content="The official HCI 2 learning platform and reviewer system for UEP IT students.">
    <meta property="og:image" content="https://hcilearn-platform.onrender.com/login-preview.jpg">
    <meta property="og:url" content="https://hcilearn-platform.onrender.com/">
    <meta property="og:type" content="website">
</head>

<body>

    <div class="container">

        <!-- Left Section: Login Form -->
        <div class="login-section">

            <div class="glass-panel">

                <img
                    src="images.png"
                    alt="University Logo"
                    class="logo"
                >

                <h1>Hello, welcome!</h1>
                <p>Log in to continue your learning journey.</p>

                <form id="loginForm">

                    <p
                        id="loginError"
                        style="color:#c0392b; display:none; margin:0 0 10px;"
                    ></p>

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">Email</label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@gmail.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">Password</label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>


                    <!-- SHOW PASSWORD + FORGOT PASSWORD -->
                    <div
                        class="checkbox-group"
                        style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;"
                    >

                        <div>

                            <input
                                type="checkbox"
                                id="show-password"
                            >

                            <label for="show-password">
                                Show Password
                            </label>

                        </div>

                        <a
                            href="#"
                            onclick="openForgotModal(); return false;"
                            style="font-size:14px; text-decoration:none; color:#007bff;"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-btn"
                        id="loginBtn"
                    >
                        Log in
                    </button>

                </form>


                <!-- SIGNUP LINK -->
                <div class="signup-link">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </div>

            </div>

        </div>


        <!-- Right Section: Image -->
        <div class="image-section"></div>

    </div>


    <!-- ==========================================
         FORGOT PASSWORD MODAL
         ========================================== -->

    <div
        id="forgotPasswordModal"
        style="
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            justify-content:center;
            align-items:center;
            z-index:1000;
        "
    >

        <div
            style="
                background:white;
                padding:24px;
                border-radius:8px;
                width:350px;
                max-width:90%;
                text-align:center;
                box-shadow:0 4px 6px rgba(0,0,0,0.1);
            "
        >

            <h3 style="margin-top:0; color:#333;">
                Reset Password
            </h3>

            <p
                style="
                    font-size:14px;
                    color:#555;
                    margin-bottom:15px;
                "
            >
                Enter your email address and we will send you a password reset link.
            </p>


            <p
                id="resetMsg"
                style="
                    display:none;
                    font-size:13px;
                    margin:0 0 12px;
                "
            ></p>


            <input
                type="email"
                id="resetEmailInput"
                placeholder="you@gmail.com"
                autocomplete="email"
                style="
                    width:90%;
                    padding:10px;
                    margin-bottom:15px;
                    border:1px solid #ccc;
                    border-radius:4px;
                "
            >


            <div
                style="
                    display:flex;
                    justify-content:center;
                    gap:10px;
                "
            >

                <button
                    id="sendResetBtn"
                    onclick="sendResetLink()"
                    style="
                        padding:10px 15px;
                        background-color:#007bff;
                        color:white;
                        border:none;
                        border-radius:4px;
                        cursor:pointer;
                        width:45%;
                    "
                >
                    Send Link
                </button>


                <button
                    type="button"
                    onclick="closeForgotModal()"
                    style="
                        padding:10px 15px;
                        background-color:#f44336;
                        color:white;
                        border:none;
                        border-radius:4px;
                        cursor:pointer;
                        width:45%;
                    "
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <script src="js/api.js"></script>

    <script>

        /* ==========================================
           FORGOT PASSWORD
           ========================================== */

        function showResetMsg(text, isError) {

            const el =
                document.getElementById('resetMsg');

            el.textContent = text;

            el.style.color =
                isError ? '#c0392b' : '#27ae60';

            el.style.display = 'block';
        }


        function openForgotModal() {

            document.getElementById('resetEmailInput').value =
                document.getElementById('email').value.trim();

            document.getElementById('resetMsg').style.display =
                'none';

            document.getElementById('forgotPasswordModal').style.display =
                'flex';
        }


        function closeForgotModal() {

            document.getElementById('forgotPasswordModal').style.display =
                'none';

            document.getElementById('resetEmailInput').value = '';

            document.getElementById('resetMsg').style.display =
                'none';
        }


        async function sendResetLink() {

            const email =
                document
                    .getElementById('resetEmailInput')
                    .value
                    .trim();

            const btn =
                document.getElementById('sendResetBtn');


            if (!email) {

                showResetMsg(
                    'Please enter your email address.',
                    true
                );

                return;
            }


            btn.disabled = true;
            btn.textContent = 'Sending...';


            try {

                const data =
                    await api.post(
                        '/auth/forgot-password',
                        { email }
                    );


                showResetMsg(
                    data.message ||
                    'Reset link sent! Please check your email.',
                    false
                );

            } catch (err) {

                showResetMsg(
                    err.message,
                    true
                );

            } finally {

                btn.disabled = false;
                btn.textContent = 'Send Link';
            }
        }


        /* ==========================================
           SHOW / HIDE PASSWORD
           ========================================== */

        document
            .getElementById('show-password')
            .addEventListener(
                'change',
                function () {

                    document.getElementById('password').type =
                        this.checked
                            ? 'text'
                            : 'password';
                }
            );


        /* ==========================================
           CHECK IF ALREADY LOGGED IN
           ========================================== */

        api.get('/auth/me')
            .then(() => {
                window.location.href = 'Dashboard.html';
            })
            .catch(() => {});


        /* ==========================================
           LOGIN
           ========================================== */

        document
            .getElementById('loginForm')
            .addEventListener(
                'submit',
                async function (e) {

                    e.preventDefault();


                    const errorEl =
                        document.getElementById('loginError');

                    const btn =
                        document.getElementById('loginBtn');


                    errorEl.style.display = 'none';


                    const email =
                        document
                            .getElementById('email')
                            .value
                            .trim();


                    const password =
                        document.getElementById('password').value;


                    btn.disabled = true;
                    btn.textContent = 'Logging in...';


                    try {

                        await api.post(
                            '/auth/login',
                            {
                                email,
                                password
                            }
                        );


                        window.location.href =
                            'Dashboard.html';

                    } catch (err) {

                        errorEl.textContent =
                            err.message;

                        errorEl.style.display =
                            'block';

                        btn.disabled = false;

                        btn.textContent =
                            'Log in';
                    }

                }
            );

    </script>

</body>
</html>
