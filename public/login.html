<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta property="og:title" content="HCILearn | Interactive Study Guide">
    <meta property="og:description" content="The official HCI 2 learning platform and reviewer system for UEP IT students.">
    <meta property="og:image" content="https://hcilearn-platform.onrender.com/login-preview.jpg">
    <meta property="og:url" content="https://hcilearn-platform.onrender.com/">
    <meta property="og:type" content="website">
</head>
<body>
    <div class="container">
        
        <!-- Left Section (Login Form) -->
        <div class="login-section">
            <div class="glass-panel">
                <img src="images.png" alt="University Logo" class="logo">
                
                <h1>Hello, welcome!</h1>
                <p>Log in to continue your learning journey.</p>

                <form id="loginForm">
                    <p id="loginError" style="color:#c0392b; display:none; margin:0 0 10px;"></p>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="you@gmail.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your Password" required>
                        </div>
                    </div>

                    <div class="checkbox-group" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div>
                            <input type="checkbox" id="show-password">
                            <label for="show-password">Show Password</label>
                        </div>
                        <!-- Idinagdag na Forgot Password Link -->
                        <a href="#" onclick="openForgotModal()" style="font-size: 14px; text-decoration: none; color: #007bff;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">Log in</button>
                </form>

                <div class="signup-link">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </div>

        <!-- Right Section (Illustration/Photo) -->
        <div class="image-section">
        </div>

    </div>

    <!-- Idinagdag na Forgot Password Modal -->
    <div id="forgotPasswordModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index: 1000;">
        <div style="background:white; padding:24px; border-radius:8px; width:350px; text-align:center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top:0; color:#333;">I-reset ang Password</h3>
            <p style="font-size: 14px; color: #555; margin-bottom: 15px;">Ilagay ang iyong email at padadalhan ka namin ng reset link.</p>
            
            <input type="email" id="resetEmailInput" placeholder="estudyante@gmail.com" style="width:90%; padding:10px; margin-bottom:15px; border: 1px solid #ccc; border-radius: 4px;">
            
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="sendResetLink()" style="padding:10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 45%;">Send Link</button>
                <button onclick="closeForgotModal()" style="padding:10px 15px; background-color: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; width: 45%;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Kung ang api.js mo ay walang Supabase initialization para sa reset, kakailanganin mo ang Supabase script dito -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
    
    <script>
        // -- Forgot Password Modal Functions --
        function openForgotModal() {
            document.getElementById('forgotPasswordModal').style.display = 'flex';
        }

        function closeForgotModal() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
            document.getElementById('resetEmailInput').value = ''; 
        }

        async function sendResetLink() {
    const emailInput = document.getElementById('resetEmailInput').value.trim();
    if (!emailInput) {
        alert("Pakilagay ang iyong email address.");
        return;
    }

    // 1. I-initialize ang Supabase dito mismo
    // Kopyahin ang mga ito mula sa iyong Supabase Dashboard -> Project Settings -> API
    const SUPABASE_URL = 'https://ajkbqtjgvyqoxmdoziio.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqa2JxdGpndnlxb3htZG96aWlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTQyMDQsImV4cCI6MjEwNjAzMDIwNH0.y7xDTCe7SDbn8tPVD5DLuxUR_EdcRvlXPG9UwKFka8s';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. I-disable ang button para hindi ma-spam click
    const btn = document.querySelector('#forgotPasswordModal button');
    if(btn) {
        btn.textContent = 'Sending...';
        btn.disabled = true;
    }

    // 3. Gamitin ang bagong gawang 'supabaseClient'
    const { data, error } = await supabaseClient.auth.resetPasswordForEmail(emailInput, {
        redirectTo: window.location.origin + '/update-password.html', 
    });

    // 4. Ibalik ang button state
    if(btn) {
        btn.textContent = 'Send Link';
        btn.disabled = false;
    }

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Naipadala na ang reset link! Paki-check ang iyong email.");
        closeForgotModal(); 
    }
}

        // -- Existing Login Functions --
        document.getElementById('show-password').addEventListener('change', function () {
            document.getElementById('password').type = this.checked ? 'text' : 'password';
        });

        api.get('/auth/me').then(() => { window.location.href = 'Dashboard.html'; }).catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errorEl.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            try {
                await api.post('/auth/login', { email, password });
                window.location.href = 'Dashboard.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log in';
            }
        });

        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
